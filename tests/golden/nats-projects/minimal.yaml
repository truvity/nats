---
# Source: nats-projects/templates/accounts.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nack
  namespace: shop
  labels:
    app.kubernetes.io/name: nack
    app.kubernetes.io/part-of: nats

---
# Source: nats-projects/templates/accounts.yaml
apiVersion: v1
kind: Secret
metadata:
  name: nack-nats-token
  namespace: shop
  labels:
    app.kubernetes.io/name: nack
    app.kubernetes.io/part-of: nats
  annotations:
    kubernetes.io/service-account.name: nack
type: kubernetes.io/service-account-token

---
# Source: nats-projects/templates/accounts.yaml
apiVersion: jetstream.nats.io/v1beta2
kind: Account
metadata:
  name: shop
  namespace: shop
  labels:
    app.kubernetes.io/name: nack
    app.kubernetes.io/part-of: nats
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  name: shop
  servers:
    - nats://nats.nats.svc:4222
  token:
    secret:
      name: nack-nats-token
    token: token
