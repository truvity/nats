# Source: nats-broker/templates/janitor.yaml
apiVersion: batch/v1
kind: CronJob
metadata:
  name: nack-janitor
  namespace: nats
  labels:
    app.kubernetes.io/name: nack-janitor
    app.kubernetes.io/part-of: nats
  annotations: {"example.com/wave":"80"}
spec:
  schedule: "*/10 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 300
      template:
        metadata:
          labels:
            app.kubernetes.io/name: nack-janitor
        spec:
          serviceAccountName: nack-janitor
          restartPolicy: Never
          nodeSelector: {"kubernetes.io/arch":"arm64"}
          tolerations: [{"key":"arch","operator":"Exists"}]
          containers:
            - name: janitor
              image: registry.example/kubectl:1.34.2
              command:
                - /bin/sh
                - -ec
                - |
                  errored_after=300
                  now=$(date +%s)
                  for kind in streams consumers; do
                    kubectl get "$kind" -A -o go-template='{{range .items}}{{$ns:=.metadata.namespace}}{{$n:=.metadata.name}}{{range .status.conditions}}{{if and (eq .type "Ready") (eq .reason "Errored")}}{{$ns}} {{$n}} {{.lastTransitionTime}}{{"\n"}}{{end}}{{end}}{{end}}' |
                    while read -r ns name since; do
                      [ -n "$ns" ] || continue
                      since_epoch=$(date -u -D %Y-%m-%dT%H:%M:%S -d "${since%%.*}" +%s)
                      if [ $((now - since_epoch)) -gt $errored_after ]; then
                        echo "reaping $kind $ns/$name (Errored since $since)"
                        kubectl delete -n "$ns" "$kind" "$name" --wait=false
                      else
                        echo "skipping $kind $ns/$name (Errored only since $since)"
                      fi
                    done
                  done
                  
              resources: {"limits":{"memory":"64Mi"},"requests":{"cpu":"10m","memory":"32Mi"}}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 65534
                capabilities:
                  drop:
                    - ALL
                seccompProfile:
                  type: RuntimeDefault
