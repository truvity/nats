# Tag-triggered release — the shared implementation.
#
# The hand-rolled copy this replaces was one of NINE near-identical
# workflows across the public estate, and the shared one had sat in
# ci-workflows with ZERO callers. That is not a cosmetic gap: bar's
# release workflows drifted out of sync with the tool they invoked and
# nobody noticed for weeks, because release machinery is exercised only
# by a tag. gemaal adopted this first and found a real bug in the
# shared workflow within two minutes (a permissions ceiling that
# dropped packages:write), fixed in ci-workflows v2.7.0 and proven by
# gemaal v0.13.7.
#
# The caller grants the permissions because a reusable workflow can
# narrow them but never widen them. That same rule is why the private
# (ECR) half is a separate workflow rather than a flag on this one.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

# Never cancel a running publish — a half-pushed artifact set is worse
# than a queued wait.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write
      packages: write
    uses: truvity/ci-workflows/.github/workflows/release-public.yaml@b38472fac2bff567c7b138654cebc7da485170ca # v3.26.1
    with:
      # One appVersion mode serves every chart here: nats-auth-callout needs
      # the release version (its image tag defaults to appVersion), so
      # nats-broker is stamped with it too. The upstream release the broker
      # wraps is its dependency in Chart.yaml and its CHANGELOG entry.
      charts: '["nats-auth-callout", "nats-broker", "nats-projects"]'
      # Nest the image under the repo namespace:
      # ko names the artifact after the cmd dir (cmd/responder), so the
      # published slug is ghcr.io/truvity/nats/responder.
      ko-docker-repo: ghcr.io/truvity/nats

  # The TypeScript client (clients/ts, @truvity/nats-client) to GitHub Packages,
  # at the tag's version. Built and tested here, so the registry holds exactly
  # what passed. After the release job: a release whose artifacts failed should
  # not leave a package claiming its version. The Go client needs nothing: it is
  # in the module, and the tag is the module version.
  npm:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          registry-url: https://npm.pkg.github.com
          scope: "@truvity"
      - name: Build, test and publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        working-directory: clients/ts
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run typecheck
          npm test
          npm run build
          # The tag is the version; package.json carries 0.0.0.
          npm version "${TAG#v}" --no-git-tag-version --allow-same-version
          npm publish
