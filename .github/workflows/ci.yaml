# CI now calls the shared workflow (truvity/ci-workflows), which fans the
# Justfile recipes out into PARALLEL jobs — one per recipe, each reporting
# under its own name. Before this they ran serially inside a single
# `just check` and a red result told you only that something failed.
#
# The recipe list mirrors this repo's own `check` recipe, so CI and a
# laptop still run the same thing; they just no longer run it the same way.
#
# Pinned by COMMIT SHA, never by tag or branch: tags move, and every
# repository in both organizations runs that code.
name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  recipes:
    uses: truvity/ci-workflows/.github/workflows/check.yaml@b38472fac2bff567c7b138654cebc7da485170ca # v3.26.1
    with:
      # Required: the component contract (C1-C13) is judged, shown in the
      # job summary, and fails this job when a rule fails.
      policy-conformance: true
      policy-conformance-strict: true
      recipes: '["build","lint","test","leak-canary"]'

  # The race detector is the one thing here that needs a C toolchain, and
  # everything else builds with cgo off — which is what makes the binary
  # static. Putting it in `check` would mean every contributor needs one to
  # run the gate at all.
  race:
    uses: truvity/ci-workflows/.github/workflows/check.yaml@b38472fac2bff567c7b138654cebc7da485170ca # v3.26.1
    with:
      recipes: '["race"]'

  # A stable context name for branch protection. The matrix jobs report as
  # "recipes / build" and so on, so a required context naming them would
  # break the moment a recipe is added or renamed.
  check:
    needs: [recipes, race]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          [ "${{ needs.recipes.result }}" = "success" ] &&
          [ "${{ needs.race.result }}" = "success" ]
