apiVersion: v2
name: nats-projects
description: >-
  The NATS account of every project namespace of a cluster, from a list of
  project rows: per row the ServiceAccount NACK presents, its long-lived
  token Secret and the NACK Account named after the namespace, which the
  auth callout maps the namespace to. One Application renders every
  project's rows; the broker's accounts and the callout's projectAccounts
  are the same list.
type: application
